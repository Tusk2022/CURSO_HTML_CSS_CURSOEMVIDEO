<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tags em HTML</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Tags em HTML</h1>
  <p>Em HTML, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utulizar em cada caso.</p>

  <ul >
    <li><span title="Para aparecer um Páragrafo usa a TAG &lt;P&gt;">Páragrafos</span></li>
    <li><span title="Use o conjunto de &lt;h1&gt;, &lt;h2&gt; e &lt;h3&gt;... Para ordenara os títulos">Títulos</span></li>
    <li><span title="Use a TAG img para selecionar o arquivo da imagem">Imagens</span></li>
    <li><span title="Você pode usar o atributo title dentro dela para mostrar o significado completo da sigla quando a pessoa passar o mouse por cima.">Abreviações</span></li>
    <li><span title="Use a tag principal &lt;ol&gt; para abrir a lista e a tag &lt;li&gt; para cada item.">Listas numericas</span></li>
    <li><span title="Use a tag principal &lt;ul&gt; para abrir a lista e a tag &lt;li&gt; para cada item.">Lista com demarcadores</span></li>
  </ul>
</body>
</html>
