<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de Caixas na prática</title>
  <style>
    h1{
      background-color: lightgray;
      width: 300px;
      height: 300px;
      border-width: 38px;
      border-style: solid;
      border-color: darkslategrey;

     

      margin-top: 20px;
      margin-right: 20px;
      margin-bottom: 40px;
      margin-left: 20px;
    }

    a{
      border-width: 10px;
      border-style: solid;
      border-color: red;

      padding-top: 10px;
      padding-left: 10px;
      padding-right: 10px;
      padding-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Exemplo de caixa box-level</h1>
  <p>Os paragrafos também são exemplo de box-level, mas os <a href="#">links são exemplos de inline-level.</a> Vamos ver como isso funciona!</p>
</body>
</html>
