<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>links</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: red;
      text-decoration: none;
      font-weight: bold;
    }

    a:visited{
      color: rgba(255, 0, 0, 0.459);
    }

    a:hover{
      color: rgb(156, 1, 1);
      text-decoration: underline;
    }

    a:active{
      color: rgb(92, 0, 0);
    }

    a::after{
      content: ' [link]';
      color: darkgray;
      text-decoration: none;
      font-weight: normal;
    }

  </style>
</head>
<body>
  <ul>
    <li><a href="https://github.com/Tusk2022" target="_blank">GitHub</a></li>
    <li><a href="https://www.linkedin.com/in/rodrigo-barbosa-de-freitas-52364420a/?isSelfProfile=true" target="_blank">likedin</a></li>
    <li><a href="https://steamcommunity.com/profiles/76561198844581821/" target="_blank">steam</a></li>
  </ul>
</body>
</html>
