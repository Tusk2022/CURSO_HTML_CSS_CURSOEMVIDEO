<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EX de hover</title>
  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
    }

    div > p{
      display: none;
    }

    div:hover > p{
      display: block;
      color: aliceblue;
      background-color: brown;
      width: 200px;
    }
    div:hover{
      color: brown;
    }
  </style>
</head>
<body>
  <h1>Ex de hover</h1>
  <p>Passe o mouse no paragrafo de baixo!</p>
  <div>
    Passe o mouse aqui!
    <p>TEXTO escondido...</p>
  </div>
  <p>Fim do exemplo</p>
</body>
</html>
