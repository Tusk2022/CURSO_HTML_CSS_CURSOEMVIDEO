<!DOCTYPE html>
<html lang="pt-br">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colocando áudio no seu site</title>
</head>
<body>
  <h1>Imagens Dinamîca</h1>
  <picture>
    <source media="(min-width: 750)" srcset="imgs/foto-p.png" type="image/png">
    <source media="(max-width: 1050px)" srcset="imgs/foto-m.png" type="image/png">
    <img src="imgs/foto-g.png" alt="foto grande">

    <h1>Reprodução de Áudio</h1>

</body>
</html>
